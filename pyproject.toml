[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-engine"
version = "0.1.0"
description = "A Windows-native Qwen3 inference engine with paged KV, CUDA graphs and HTTP serving"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
model = ["transformers>=4.51,<5", "safetensors>=0.4"]
dev = ["pytest>=8"]
cuda = ["ninja>=1.11"]

[tool.setuptools.package-data]
"mini_engine.kernels" = ["csrc/*.cpp", "csrc/*.cu"]

[tool.setuptools.packages.find]
include = ["mini_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "build/pytest_cache"
